version: 2

models:
  - name: gold_movie_revenue_insights
    description: "Insights sur les revenus des films et catégorisation en fonction de leur succès."
    columns:
      - name: movie_id
        description: "Identifiant unique du film."
        tests:
          - not_null
          - unique
      - name: title
        description: "Titre du film."
        tests:
          - not_null
      - name: total_revenue
        description: "Revenus totaux générés par le film (ventes domestiques et internationales)."
        tests:
          - not_null
      - name: revenue_category
        description: "Catégorie de revenus ('Blockbuster', 'Hit', 'Moderate')."
        tests:
          - not_null
          - accepted_values:
              values: ['Blockbuster', 'Hit', 'Moderate']
