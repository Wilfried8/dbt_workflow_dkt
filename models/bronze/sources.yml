version: 2
sources:
  - name: Bronze_dbt_workflow
    description: "Contient les données brutes provenant de la table bronze_table"
    schema: "{{ 'dev_source_dbt_workflow' if target.name == 'dev' else 'prod_source_dbt_workflow'}}"
    tables:
      - name: raw_movies
        description: "Table contenant les données brutes des films"
        columns:
          - name: id
            description: "id"
            data_tests:
              - unique
              - not_null
          - name: title
            description: "Titre du film"
            data_tests:
              - not_null
          - name: director
            description: "Réalisateur du film"
          - name: year
            description: "Année de sortie du film"
            data_tests:
              - not_null
              - custom_range: 
                  min: 1700
                  max: 2026
          - name: length_minutes
            description: "Durée du film en minutes"
            data_tests:
              - not_null
              - custom_range:
                  min: 2
                  max: 500
      - name: raw_sales_movies
        description: "Table contenant les données brutes des ventes de films"
        columns:
          - name: movie_id
            data_tests:
              - not_null
          - name: rating
            description: "Note moyenne attribuée au film"
            data_tests:
              - not_null
              - custom_range:
                  min: 0
                  max: 10