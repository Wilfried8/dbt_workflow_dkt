version: 2

models:
  - name: silver_movies_clean
    description: "Ce modèle nettoie les données brutes des films issues de la table Bronze 
      pour s'assurer de la qualité des données et de leur fiabilité avant analyse"
    columns:
      - name: id
        description: "Identifiant unique du film (clé primaire)."
        tests:
          - unique
          - not_null
      - name: title
        description: "Titre du film."
        tests:
          - not_null
      - name: director
        description: "Nom du réalisateur du film."
      - name: year
        description: "Année de sortie du film."
        tests:
          - not_null
      - name: length_minutes
        description: "Durée du film en minutes."
 
